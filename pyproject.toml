[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dumedb"
version = "1.2.2"
description = "Hardware-Aligned Zero-Copy Byte-Structured Memory Engine for AI Agents"
readme = "README.md"
authors = [{ name = "MadBrad", email = "madbradsmith@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["ai-memory", "agent-memory", "lmdb", "hardware-aligned", "zero-copy", "openai-proxy", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "lmdb>=1.4.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0"
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
dumedb = "dume.server.app:main"
dume-mcp = "dume.mcp_server:main"

[project.urls]
Homepage = "https://dumedb.developumaiengine.com"
Repository = "https://github.com/madbradsmith/DUMEdb"

[tool.setuptools.packages.find]
where = ["."]
include = ["dume*"]

[tool.setuptools.package-data]
"dume" = ["ui/inspector/**/*", "schemas/presets/*.json"]
